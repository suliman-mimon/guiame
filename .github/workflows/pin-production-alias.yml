name: Pin production alias

on:
  push:
    branches: [main]

jobs:
  pin-alias:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM_ID: team_IhqAW0cd35HPNS23BqNiZuV7
      PROJECT_ID: prj_diT0LqUpEIXtIhVIYhsTJ86ieCwk
      ALIAS: guiame-dgp.vercel.app
    steps:
      - name: Wait for the matching production deployment to be ready
        id: find
        run: |
          for i in $(seq 1 60); do
            RESPONSE=$(curl -s "https://api.vercel.com/v6/deployments?projectId=$PROJECT_ID&teamId=$TEAM_ID&target=production&limit=10" \
              -H "Authorization: Bearer $VERCEL_TOKEN")

            RESULT=$(echo "$RESPONSE" | python3 -c "
import json, sys, os
data = json.loads(sys.stdin.read(), strict=False)
sha = os.environ['GITHUB_SHA']
for d in data['deployments']:
    if d.get('meta', {}).get('githubCommitSha') == sha:
        print(d['readyState'])
        print(d['uid'])
        break
")
            READY_STATE=$(echo "$RESULT" | sed -n '1p')
            UID_VAL=$(echo "$RESULT" | sed -n '2p')

            if [ "$READY_STATE" = "READY" ]; then
              echo "uid=$UID_VAL" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$READY_STATE" = "ERROR" ] || [ "$READY_STATE" = "CANCELED" ]; then
              echo "Deployment for $GITHUB_SHA ended in $READY_STATE, not aliasing."
              exit 1
            fi

            sleep 10
          done

          echo "Timed out waiting for a production deployment matching $GITHUB_SHA"
          exit 1

      - name: Point alias at the new deployment
        run: |
          curl -s -X POST "https://api.vercel.com/v2/deployments/${{ steps.find.outputs.uid }}/aliases?teamId=$TEAM_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"alias\": \"$ALIAS\"}"
